name: CI

on:
    push:
        branches: ['**']
    pull_request:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Lint, test & build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            # Sin cache: pnpm — ese cache de actions/setup-node necesita un
            # pnpm-lock.yaml commiteado para generar la clave, y este repo
            # no lo commitea (está en .gitignore).
            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            # No hay pnpm-lock.yaml commiteado en este repo (está en
            # .gitignore), así que no se puede usar --frozen-lockfile.
            - name: Install dependencies
              run: pnpm install

            - name: Lint (oxlint)
              run: pnpm lint

            - name: Test
              run: pnpm test

            # Tipos de src/ y tests/ (sin examples/: sus errores son a propósito)
            - name: Typecheck
              run: pnpm typecheck

            - name: Build
              run: pnpm build

    e2e:
        name: E2E (Playwright)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            # Sin cache: pnpm — ese cache de actions/setup-node necesita un
            # pnpm-lock.yaml commiteado para generar la clave, y este repo
            # no lo commitea (está en .gitignore).
            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: pnpm install

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps

            - name: Run e2e tests
              run: pnpm e2e

            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
